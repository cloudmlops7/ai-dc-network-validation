frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.12.1/30
!
interface eth2
 ip address 10.0.13.1/30
!
interface lo
 ip address 1.1.1.1/32
!
route-map LAB-PERMIT-ALL permit 10
!
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 10.0.12.2 remote-as 65002
 neighbor 10.0.13.2 remote-as 65003
 address-family ipv4 unicast
  neighbor 10.0.12.2 route-map LAB-PERMIT-ALL in
  neighbor 10.0.12.2 route-map LAB-PERMIT-ALL out
  neighbor 10.0.13.2 route-map LAB-PERMIT-ALL in
  neighbor 10.0.13.2 route-map LAB-PERMIT-ALL out
  neighbor 10.0.12.2 activate
  neighbor 10.0.13.2 activate
  network 10.0.12.0/30
 exit-address-family
!
