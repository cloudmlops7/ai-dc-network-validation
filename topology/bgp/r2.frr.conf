frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.12.2/30
!
interface eth2
 ip address 10.0.23.1/30
!
interface lo
 ip address 2.2.2.2/32
!
route-map LAB-PERMIT-ALL permit 10
!
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.23.2 remote-as 65003
 address-family ipv4 unicast
  neighbor 10.0.12.1 route-map LAB-PERMIT-ALL in
  neighbor 10.0.12.1 route-map LAB-PERMIT-ALL out
  neighbor 10.0.23.2 route-map LAB-PERMIT-ALL in
  neighbor 10.0.23.2 route-map LAB-PERMIT-ALL out
  neighbor 10.0.12.1 activate
  neighbor 10.0.23.2 activate
 exit-address-family
!
