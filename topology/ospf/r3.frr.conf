frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.23.2/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.13.2/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface lo
 ip address 3.3.3.3/32
 ip ospf area 0
!
router ospf
 ospf router-id 3.3.3.3
 passive-interface lo
!
