frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.23.2/30
!
interface eth2
 ip address 10.0.13.2/30
!
interface lo
 ip address 3.3.3.3/32
!
route-map LAB-PERMIT-ALL permit 10
!
router bgp 65003
 bgp router-id 3.3.3.3
 neighbor 10.0.23.1 remote-as 65002
 neighbor 10.0.13.1 remote-as 65001
 address-family ipv4 unicast
  neighbor 10.0.23.1 route-map LAB-PERMIT-ALL in
  neighbor 10.0.23.1 route-map LAB-PERMIT-ALL out
  neighbor 10.0.13.1 route-map LAB-PERMIT-ALL in
  neighbor 10.0.13.1 route-map LAB-PERMIT-ALL out
  neighbor 10.0.23.1 activate
  neighbor 10.0.13.1 activate
  network 3.3.3.3/32
 exit-address-family
!
