frr version 10.7.1_git
frr defaults traditional
hostname spine1
!
router bgp 65000
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 10.0.11.1 remote-as 65101
 neighbor 10.0.21.1 remote-as 65102
 !
 address-family ipv4 unicast
  network 1.1.1.1/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.11.1 activate
  neighbor 10.0.21.1 activate
 exit-address-family
exit
!
