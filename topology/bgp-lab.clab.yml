name: bgpline

topology:
  nodes:
    r1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      daemons:
        - bgpd
      startup-config: bgp/r1.frr.conf
      enforce-startup-config: true

    r2:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      daemons:
        - bgpd
      startup-config: bgp/r2.frr.conf
      enforce-startup-config: true

    r3:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      daemons:
        - bgpd
      startup-config: bgp/r3.frr.conf
      enforce-startup-config: true

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r1:eth2", "r3:eth2"]
