frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.13.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface lo
 ip address 1.1.1.1/32
 ip ospf area 0
!
router ospf
 ospf router-id 1.1.1.1
 passive-interface lo
!
