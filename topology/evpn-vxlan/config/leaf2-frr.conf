frr version 10.7.1_git
frr defaults traditional
hostname leaf2
!
router bgp 65102
 bgp router-id 22.22.22.22
 no bgp ebgp-requires-policy
 neighbor 10.0.21.2 remote-as 65000
 neighbor 10.0.22.2 remote-as 65000
 !
 address-family ipv4 unicast
  network 22.22.22.22/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.21.2 activate
  neighbor 10.0.22.2 activate
  advertise-all-vni
 exit-address-family
exit
!
